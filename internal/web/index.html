<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>bot-hub</title>
<style>
  /* tokens: see DESIGN.md §2 */
  :root {
    --page: #efece8;
    --card: #ffffff;
    --s1: #f5f3f0;
    --s2: #e9e5e0;
    --s3: #dcd7d0;
    --text: #1d1b19;
    --text-2: #57524d;
    --mute: #9b958f;
    --accent: #d9774b;
    --accent-text: #ffffff;
    --accent-soft: #f8e1d6;
    --sel: #faebe4;
    --pink: #f7d9d3;
    --pink-ink: #b2443a;
    --lilac: #e0dbfb;
    --lilac-ink: #6a55c9;
    --sage: #e2e9cc;
    --sage-ink: #6b8a2a;
    --busy: #f08a2c;
    --danger: #d9483b;
    --shade: rgba(29, 27, 25, .28);
    --eye: rgba(28, 20, 14, .88);
    --face-mix: 100%;
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Hiragino Sans GB", "Segoe UI", "Microsoft YaHei", sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --page: #000000;
      --card: #111111;
      --s1: #1a1a1a;
      --s2: #262626;
      --s3: #333333;
      --text: #f3f1ee;
      --text-2: #bdb8b2;
      --mute: #77726d;
      --accent-soft: #262626;
      --sel: #1e1e1e;
      --pink: #111111;
      --pink-ink: #f0a59b;
      --lilac: #1b1928;
      --lilac-ink: #b7aaf5;
      --sage: #111111;
      --sage-ink: #a9c46a;
      --danger: #f0605a;
      --shade: rgba(0, 0, 0, .6);
      --face-mix: 16%;
      color-scheme: dark;
    }
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { background: var(--page); color: var(--text); font: 14.5px/1.6 var(--font); -webkit-font-smoothing: antialiased; }
  button, input, textarea, select { font: inherit; color: inherit; background: none; border: 0; }
  button { cursor: pointer; }
  button:disabled { cursor: default; opacity: .4; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  svg { display: block; }

  .app { display: grid; grid-template-columns: 320px minmax(0, 1fr); gap: 14px; padding: 14px; height: 100vh; height: 100dvh; }

  /* ---------- avatar: round face + blob with two eyes ---------- */
  .av { position: relative; flex: none; border-radius: 50%; background: color-mix(in srgb, var(--fc) var(--face-mix), #161616); }
  .av svg { width: 100%; height: 100%; padding: 16%; overflow: visible; }
  .av .busy { position: absolute; right: 0; bottom: 0; width: 26%; height: 26%; min-width: 9px; min-height: 9px; border-radius: 50%; background: var(--busy); box-shadow: 0 0 0 2.5px var(--card); animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { transform: scale(.7); opacity: .6; } }

  .circle { width: 42px; height: 42px; border-radius: 50%; background: var(--card); display: grid; place-items: center; flex: none; color: var(--text-2); transition: background .15s, color .15s, transform .15s; }
  .circle:hover:not(:disabled) { background: var(--s1); color: var(--text); }
  .circle:active:not(:disabled) { transform: scale(.94); }
  .circle svg { width: 18px; height: 18px; }
  .ghost { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; flex: none; color: var(--mute); transition: background .15s, color .15s; }
  .ghost:hover { background: var(--s1); color: var(--text); }
  .ghost svg { width: 17px; height: 17px; }

  /* ---------- sidebar ---------- */
  .side { background: var(--card); border-radius: 32px; display: flex; flex-direction: column; min-height: 0; padding: 20px 14px 12px; }
  .side-hd { display: flex; align-items: center; justify-content: space-between; padding: 0 8px; }
  .side-hd h2 { font-size: 20px; font-weight: 700; letter-spacing: -.01em; }
  .side-hd h2 span { font-size: 13px; font-weight: 600; color: var(--mute); margin-left: 5px; }
  .search { display: flex; align-items: center; gap: 8px; margin: 14px 4px 10px; padding: 9px 16px; border-radius: 999px; background: var(--s1); color: var(--mute); }
  .search svg { width: 15px; height: 15px; flex: none; }
  .search input { flex: 1; min-width: 0; outline: none; color: var(--text); font-size: 13.5px; }
  .search input::placeholder { color: var(--mute); }

  .list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; padding: 0 2px; scrollbar-width: none; }
  .item { width: 100%; display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 22px; text-align: left; transition: background .15s; }
  @media (hover: hover) { .item:hover { background: var(--s1); } }
  .item.on { background: var(--sel); }
  .item.on .busy { box-shadow: 0 0 0 2.5px var(--sel); }
  .item .av { width: 46px; height: 46px; }
  .item .txt { flex: 1; min-width: 0; }
  .item .nm { display: flex; justify-content: space-between; gap: 8px; font-weight: 700; }
  .item .nm span, .item .pv span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .nm time { flex: none; font-size: 11.5px; font-weight: 500; color: var(--mute); }
  .item .pv { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 13px; color: var(--mute); }
  .item .pv.run span { color: var(--busy); }
  .badge { flex: none; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; background: var(--lilac); color: var(--lilac-ink); font-size: 11px; font-weight: 700; line-height: 20px; text-align: center; font-style: normal; }
  .none { color: var(--mute); font-size: 13px; padding: 16px 12px; }

  .side-ft { display: flex; align-items: center; gap: 4px; margin-top: 8px; }
  .settings { flex: 1; display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 22px; font-weight: 600; color: var(--text-2); text-align: left; transition: background .15s, color .15s; }
  .settings:hover { background: var(--s1); color: var(--text); }
  .settings svg { width: 19px; height: 19px; }
  .side-ft .ghost { width: 40px; height: 40px; }
  .side-ft .ghost svg { width: 18px; height: 18px; }

  /* ---------- main ---------- */
  .main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .chat-hd { display: flex; align-items: center; gap: 12px; padding: 4px 6px 10px; }
  .chat-hd .av { width: 48px; height: 48px; }
  .chat-hd .who { flex: 1; min-width: 0; }
  .chat-hd h1 { font-size: 17px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chat-hd .st { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chat-hd .st i { width: 6px; height: 6px; border-radius: 50%; background: var(--busy); flex: none; animation: pulse 1.2s ease-in-out infinite; }
  .chat-hd .st.off { color: var(--danger); }
  .chat-hd .st.off i { background: var(--danger); animation: none; }
  .menu { display: none; }

  .scroll { flex: 1; overflow-y: auto; }
  .thread { max-width: 800px; min-height: 100%; margin: 0 auto; padding: 8px 20px 20px; display: flex; flex-direction: column; gap: 6px; }

  .stamp { align-self: center; font-size: 12px; color: var(--mute); background: var(--card); padding: 3px 12px; border-radius: 999px; margin: 16px 0 8px; }
  .msg { display: flex; flex-direction: column; max-width: 100%; }
  .msg.me { align-items: flex-end; margin-top: 6px; }
  .msg.bot { align-items: flex-start; }
  .bubble { padding: 11px 18px; border-radius: 24px; background: var(--card); max-width: 80%; min-width: 0; }
  .msg.me .bubble { background: var(--accent-soft); max-width: 72%; }
  .msg .label { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--mute); margin: 8px 10px 4px; }
  .msg .label .av { width: 18px; height: 18px; }
  .msg.peer .bubble { background: var(--lilac); }
  .msg .foot { font-size: 12px; color: var(--mute); margin: 4px 12px 0; }
  .msg.sys { align-items: center; }
  .msg.sys .note { font-size: 13px; color: var(--mute); text-align: center; max-width: 80%; }
  .msg.err .note { color: var(--danger); }
  .msg.cmd .bubble { font-family: var(--mono); font-size: 13px; white-space: pre-wrap; max-width: 100%; }
  .msg.fresh { animation: rise .22s ease-out; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } }

  .live { display: flex; align-items: center; gap: 10px; margin: 10px 0 0 6px; }
  .live .av { width: 26px; height: 26px; }
  .shimmer { background: linear-gradient(90deg, var(--mute) 30%, var(--text) 50%, var(--mute) 70%); background-size: 200% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: shine 1.8s linear infinite; }
  @keyframes shine { from { background-position: 100% 0; } to { background-position: -100% 0; } }

  /* markdown */
  .md { overflow-wrap: anywhere; }
  .md > * + * { margin-top: .6em; }
  .md h1, .md h2, .md h3, .md h4 { font-size: 1.02em; font-weight: 700; }
  .md ul, .md ol { padding-left: 1.3em; }
  .md li + li { margin-top: .2em; }
  .md blockquote { border-left: 3px solid var(--s3); padding-left: 12px; color: var(--text-2); }
  .md a { color: inherit; text-decoration: underline; text-decoration-color: var(--mute); text-underline-offset: 3px; }
  .md hr { border: 0; border-top: 1px solid var(--s3); }
  .md strong { font-weight: 700; }
  .md code { font-family: var(--mono); font-size: .86em; background: var(--s1); padding: 1px 6px; border-radius: 6px; }
  .msg.me .md code, .msg.peer .md code { background: rgba(127, 127, 127, .14); }
  .code { background: var(--s1); border-radius: 14px; overflow: hidden; }
  .code-h { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--mute); padding: 6px 8px 6px 14px; }
  .code-h button { font-size: 12px; padding: 2px 10px; border-radius: 999px; color: var(--mute); }
  .code-h button:hover { background: var(--s2); color: var(--text); }
  .code pre { padding: 2px 14px 12px; overflow-x: auto; font-family: var(--mono); font-size: 13px; line-height: 1.55; }
  .code pre code { background: none; padding: 0; }

  /* empty */
  .hello { margin: auto; display: flex; flex-direction: column; align-items: center; text-align: center; padding: 40px 24px; gap: 4px; }
  .hello .av { width: 84px; height: 84px; margin-bottom: 12px; }
  .hello h2 { font-size: 22px; font-weight: 700; letter-spacing: -.01em; }
  .hello p { color: var(--mute); font-size: 14px; max-width: 420px; }
  .sugs { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 20px; }
  .sug { padding: 10px 16px; border-radius: 20px; font-size: 13px; text-align: left; transition: transform .15s; }
  .sug:hover { transform: translateY(-2px); }
  .sug b { display: block; font-size: 13.5px; }
  .sug span { opacity: .75; }
  .sug.p { background: var(--pink); color: var(--pink-ink); }
  .sug.l { background: var(--lilac); color: var(--lilac-ink); }
  .sug.g { background: var(--sage); color: var(--sage-ink); }
  .sug.n { background: var(--card); color: var(--text-2); }

  /* composer */
  .composer-wrap { padding: 6px 20px 4px; }
  .composer { position: relative; max-width: 800px; margin: 0 auto; display: flex; align-items: flex-end; gap: 8px; background: var(--card); border-radius: 32px; padding: 7px; }
  .composer textarea { flex: 1; resize: none; outline: none; padding: 9px 4px; min-height: 42px; max-height: 220px; line-height: 24px; }
  .composer textarea::placeholder { color: var(--mute); }
  .composer .circle { background: var(--s1); font: 600 17px var(--mono); }
  .composer .circle:hover { background: var(--s2); }
  .send { width: 42px; height: 42px; border-radius: 50%; background: var(--accent); color: var(--accent-text); display: grid; place-items: center; flex: none; transition: transform .15s, opacity .15s; }
  .send:active:not(:disabled) { transform: scale(.92); }
  .send svg { width: 19px; height: 19px; }
  .send.stop { background: var(--text); color: var(--card); }
  .pop { position: absolute; left: 6px; bottom: calc(100% + 8px); background: var(--card); border-radius: 20px; padding: 6px; min-width: 250px; box-shadow: 0 12px 32px rgba(0, 0, 0, .16); display: none; z-index: 10; }
  .pop.open { display: block; animation: rise .15s ease-out; }
  .pop button { width: 100%; display: flex; justify-content: space-between; gap: 16px; text-align: left; padding: 8px 12px; border-radius: 14px; font-size: 14px; font-family: var(--mono); }
  .pop button:hover { background: var(--s1); }
  .pop button span { color: var(--mute); font-size: 13px; font-family: var(--font); }

  /* panel */
  .shade { position: fixed; inset: 0; background: var(--shade); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 30; }
  .shade.open { opacity: 1; pointer-events: auto; }
  .panel { position: fixed; top: 14px; right: 14px; bottom: 14px; width: min(420px, calc(100vw - 28px)); background: var(--card); border-radius: 32px; z-index: 31; display: flex; flex-direction: column; box-shadow: 0 24px 60px rgba(0, 0, 0, .18); transform: translateX(calc(100% + 28px)); visibility: hidden; transition: transform .25s ease, visibility .25s; }
  .panel.open { transform: none; visibility: visible; }
  .panel-x { position: absolute; top: 14px; right: 14px; background: var(--s1); }
  .panel-b { flex: 1; overflow-y: auto; padding: 30px 22px 20px; }
  .p-hero { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 4px; margin-bottom: 20px; }
  .p-hero .av { width: 80px; height: 80px; margin-bottom: 8px; }
  .p-hero h2 { font-size: 20px; font-weight: 700; }
  .p-hero p { color: var(--mute); font-size: 13.5px; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 16px; }
  .stat { background: var(--s1); border-radius: 16px; padding: 10px 14px; }
  .stat b { display: block; font-size: 17px; font-weight: 700; }
  .stat span { font-size: 12px; color: var(--mute); }
  .kv { background: var(--s1); border-radius: 16px; padding: 4px 14px; font-size: 13px; }
  .kv div { display: flex; justify-content: space-between; gap: 16px; padding: 9px 0; }
  .kv div + div { border-top: 1px solid var(--s2); }
  .kv dt { color: var(--mute); flex: none; }
  .kv dd { text-align: right; word-break: break-all; font-family: var(--mono); font-size: 12.5px; }
  .sec { font-size: 13px; color: var(--mute); margin: 20px 4px 8px; }
  .agents { font-family: var(--mono); font-size: 12.5px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; color: var(--text-2); background: var(--s1); border-radius: 16px; padding: 12px 14px; }
  .panel-f { padding: 12px 22px 20px; }

  /* dialogs */
  .dlg-wrap { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; padding: 16px; background: var(--shade); opacity: 0; pointer-events: none; transition: opacity .15s; }
  .dlg-wrap.open { opacity: 1; pointer-events: auto; }
  .dlg { width: min(520px, 100%); max-height: calc(100dvh - 32px); display: flex; flex-direction: column; background: var(--card); border-radius: 28px; box-shadow: 0 24px 60px rgba(0, 0, 0, .2); transform: scale(.98); transition: transform .15s; }
  .dlg-wrap.open .dlg { transform: none; }
  .dlg.sm { width: min(400px, 100%); }
  .dlg.wide { width: min(680px, 100%); }
  .dlg-h { padding: 24px 24px 4px; display: flex; align-items: center; gap: 14px; }
  .dlg-h .av { width: 52px; height: 52px; }
  .dlg-h h3 { font-size: 18px; font-weight: 700; }
  .dlg-h p { font-size: 13px; color: var(--mute); }
  .dlg-b { padding: 16px 24px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
  .dlg-b > p { color: var(--text-2); }
  .dlg-f { padding: 4px 24px 24px; display: flex; justify-content: flex-end; gap: 8px; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .fld label { display: flex; justify-content: space-between; font-size: 13px; color: var(--text-2); margin: 0 6px 6px; }
  .fld label em { font-style: normal; color: var(--mute); }
  .fld input, .fld textarea, .fld select, .brow input, .brow select { width: 100%; background: var(--s1); border: 1px solid var(--s2); border-radius: 14px; padding: 9px 12px; outline: none; transition: border-color .15s; }
  .fld input:focus, .fld textarea:focus, .fld select:focus, .brow input:focus, .brow select:focus { border-color: var(--accent); }
  .fld .mono { font-family: var(--mono); font-size: 13.5px; }
  .fld textarea { resize: vertical; min-height: 110px; font-family: var(--mono); font-size: 13px; line-height: 1.55; }
  .brow { display: grid; grid-template-columns: 30px minmax(0, 1fr) 118px minmax(0, 1.4fr); gap: 10px; align-items: center; }
  .brow .av { width: 30px; height: 30px; }
  .brow .nm { font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .brow input { font-family: var(--mono); font-size: 13px; }
  .brow select { font-size: 13.5px; }
  .sub { font-size: 13px; color: var(--mute); margin: 6px 6px -2px; }
  .seg { display: inline-flex; align-self: flex-start; gap: 2px; padding: 3px; border-radius: 999px; background: var(--s1); }
  .seg button { padding: 6px 16px; border-radius: 999px; font-size: 13.5px; color: var(--text-2); transition: background .15s, color .15s; }
  .seg button.on { background: var(--card); color: var(--text); font-weight: 600; box-shadow: 0 1px 3px rgba(0, 0, 0, .08); }
  .seg button:disabled { opacity: .6; }
  .hint { font-size: 13px; color: var(--mute); margin: -4px 6px 0; }
  .note { background: var(--s1); border-radius: 16px; padding: 12px 14px; font-size: 13px; color: var(--text-2); display: flex; flex-direction: column; gap: 8px; }
  .note .cmd { display: flex; align-items: center; gap: 8px; background: var(--card); border-radius: 12px; padding: 6px 6px 6px 12px; }
  .note .cmd code { flex: 1; min-width: 0; font-family: var(--mono); font-size: 12.5px; overflow-x: auto; white-space: nowrap; }
  .note .cmd button { padding: 4px 12px; border-radius: 999px; font-size: 12.5px; background: var(--s1); }
  .note .cmd button:hover { background: var(--s2); }
  .note a { color: var(--text); }
  .mp { font-size: 12px; padding: 1px 10px; border-radius: 999px; background: var(--s1); color: var(--text-2); }
  button.mp:hover { background: var(--s2); color: var(--text); }
  .mp.ok { background: var(--sage); color: var(--sage-ink); }
  .msg-err { font-size: 13px; color: var(--danger); min-height: 1em; padding: 0 6px; }
  .btn { padding: 9px 18px; border-radius: 999px; font-size: 14px; font-weight: 600; background: var(--s1); transition: background .15s, filter .15s; }
  .btn:hover { background: var(--s2); }
  .btn.go { background: var(--accent); color: var(--accent-text); }
  .btn.go:hover { filter: brightness(1.06); }
  .btn.bad { background: var(--danger); color: #fff; }
  .btn.bad:hover { filter: brightness(1.06); }
  .btn.ghost-bad { width: 100%; color: var(--danger); background: var(--s1); }
  .btn.ghost-bad:hover { background: var(--s2); }

  .toast { position: fixed; left: 50%; bottom: 100px; transform: translateX(-50%); background: var(--text); color: var(--card); font-size: 14px; padding: 9px 18px; border-radius: 999px; z-index: 50; animation: rise .18s ease-out; }

  @media (max-width: 900px) {
    .app { grid-template-columns: 260px minmax(0, 1fr); }
  }
  @media (max-width: 820px) {
    .app { grid-template-columns: 1fr; padding: 8px; }
    .side { position: fixed; inset: 8px auto 8px 8px; width: min(320px, 86vw); z-index: 32; box-shadow: 0 24px 60px rgba(0, 0, 0, .2); transform: translateX(calc(-100% - 16px)); visibility: hidden; transition: transform .25s ease, visibility .25s; }
    .side.open { transform: none; visibility: visible; }
    .menu { display: grid; }
    .thread { padding: 8px 6px 16px; }
    .bubble { max-width: 92%; }
    .msg.me .bubble { max-width: 85%; }
    .composer-wrap { padding: 6px 2px 4px; }
    .two { grid-template-columns: 1fr; }
    .brow { grid-template-columns: 30px minmax(0, 1fr) 110px; }
    .brow input { grid-column: 2 / -1; }
  }
</style>
</head>
<body>
<div class="app">
  <aside id="side" class="side">
    <div class="side-hd">
      <h2>Bots<span id="botCount"></span></h2>
      <button id="openCreate" class="ghost" aria-label="新建 Bot" title="新建 Bot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
    </div>
    <label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="filter" placeholder="搜索 Bot" autocomplete="off" /></label>
    <nav id="bots" class="list"></nav>
    <div class="side-ft">

<script>
const $ = id => document.getElementById(id);
const state = { bots: [], active: null, msgs: {}, last: {}, unread: {}, tool: {}, filter: '', online: true, seen: new Set(), settings: null, models: {} };

/* ---------- utils ---------- */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const activeBot = () => state.bots.find(b => b.id === state.active);
function hash(s) { let h = 2166136261; for (const c of String(s)) h = Math.imul(h ^ c.codePointAt(0), 16777619); return h >>> 0; }

/* ---------- avatar template: round face + blob with two eyes (DESIGN.md §6) ---------- */
// [face, blob] pairs; assigned by list order so neighbours differ, hashed for ids not in the list
const PAIRS = [['#fde7b0', '#f08a2c'], ['#e0dbfb', '#8a7ad8'], ['#e2e9cc', '#86a33a'], ['#f7d9d3', '#b85a4a'], ['#ebe5dc', '#7a7465'], ['#fbd8bf', '#e0685a']];
function avatar(id, cls = '', extra = '') {
  const h = hash(id || '?');
  const i = state.bots.findIndex(b => b.id === id);
  const [face, color] = PAIRS[(i >= 0 ? i : h) % PAIRS.length];
  const tilt = (h >>> 4) % 25 - 12;
  const gx = (h >>> 9) % 7 - 3;
  const gy = (h >>> 12) % 5 - 2;
  const lean = (h >>> 15) % 2 ? -14 : 12;
  const eye = (cx, cy) => `<ellipse cx="${cx + gx}" cy="${cy + gy}" rx="6" ry="10.5" transform="rotate(${lean} ${cx + gx} ${cy + gy})" fill="var(--eye)"/>`;
  return `<div class="av ${cls}" style="--fc:${face}"><svg viewBox="0 0 100 100" aria-hidden="true"><g transform="rotate(${tilt} 50 50)">
    <path d="M52 9C80 9 95 28 93 55C91 81 72 93 47 91C21 89 5 72 7 46C9 22 26 9 52 9Z" fill="${color}"/>${eye(39, 45)}${eye(62, 43)}
  </g></svg>${extra}</div>`;
}

function stamp(iso) {
  const d = new Date(iso);
  if (isNaN(d)) return '';
  const t = d.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
  const today = new Date(); const y = new Date(today); y.setDate(today.getDate() - 1);
  if (d.toDateString() === today.toDateString()) return `今天 ${t}`;
  if (d.toDateString() === y.toDateString()) return `昨天 ${t}`;
  return `${d.getMonth() + 1}月${d.getDate()}日 ${t}`;
}
const plain = s => String(s || '').replace(/```[\s\S]*?```/g, '[代码]').replace(/[#>*`_\[\]]/g, '').replace(/\s+/g, ' ').trim();
let toastTimer;
function toast(text) {
  document.querySelector('.toast')?.remove();
  const el = document.createElement('div');
  el.className = 'toast'; el.textContent = text;
  document.body.appendChild(el);
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.remove(), 2600);
}

/* ---------- markdown: escape first, then a small safe subset ---------- */
function inline(s) {
  return s
    .replace(/`([^`\n]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>')
    .replace(/\[([^\]\n]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>')
    .replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g, '$1<a href="$2" target="_blank" rel="noopener noreferrer">$2</a>');
}
function md(text) {
  const out = [];
  esc(text || '').split(/```/).forEach((part, i) => {
    if (i % 2) {
      const nl = part.indexOf('\n');
      const lang = nl > -1 ? part.slice(0, nl).trim() : '';
      const code = (nl > -1 ? part.slice(nl + 1) : part).replace(/\n$/, '');
      out.push(`<div class="code"><div class="code-h"><span>${lang || 'code'}</span><button type="button" data-copy>复制</button></div><pre><code>${code}</code></pre></div>`);
      return;
    }
    let list = null, para = [];
    const fp = () => { if (para.length) { out.push(`<p>${para.map(inline).join('<br>')}</p>`); para = []; } };
    const fl = () => { if (list) { out.push(`<${list.t}>${list.items.map(x => `<li>${inline(x)}</li>`).join('')}</${list.t}>`); list = null; } };
    for (const line of part.split('\n')) {
      let m;
      if (!line.trim()) { fp(); fl(); continue; }
      if ((m = line.match(/^(#{1,4})\s+(.*)$/))) { fp(); fl(); out.push(`<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`); continue; }
      if (/^\s*(-{3,}|\*{3,})\s*$/.test(line)) { fp(); fl(); out.push('<hr>'); continue; }
      if ((m = line.match(/^&gt;\s?(.*)$/))) { fp(); fl(); out.push(`<blockquote>${inline(m[1])}</blockquote>`); continue; }
      if ((m = line.match(/^\s*[-*+]\s+(.*)$/)) || (m = line.match(/^\s*\d+[.)]\s+(.*)$/))) {
        const t = /^\s*\d/.test(line) ? 'ol' : 'ul';
        fp();
        if (!list || list.t !== t) { fl(); list = { t, items: [] }; }
        list.items.push(m[1]);
        continue;
      }
      fl(); para.push(line);
    }
    fp(); fl();
  });
  return `<div class="md">${out.join('')}</div>`;
}

/* ---------- api ---------- */
async function api(path, opts = {}) {
  const res = await fetch(path, {
    method: opts.method,
    headers: opts.body ? { 'Content-Type': 'application/json' } : undefined,
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  if (res.status === 401 && path !== '/api/login') { open('loginDlg'); throw new Error('unauthorized'); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
  return data;
}

/* ---------- render: sidebar ---------- */
function short(iso) {
  const d = new Date(iso);
  if (isNaN(d)) return '';
  const today = new Date(); const y = new Date(today); y.setDate(today.getDate() - 1);
  if (d.toDateString() === today.toDateString()) return d.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
  if (d.toDateString() === y.toDateString()) return '昨天';
  return `${d.getMonth() + 1}/${d.getDate()}`;
}
function preview(b) {
  const unread = state.unread[b.id] ? `<i class="badge">${state.unread[b.id]}</i>` : '';
  if (b.busy) return `<div class="pv run"><span>${state.tool[b.id] ? `正在调用 ${esc(state.tool[b.id])}` : '正在思考…'}</span>${unread}</div>`;
  const m = state.last[b.id];
  if (!m) return `<div class="pv"><span>${esc(b.description || '还没有消息')}</span>${unread}</div>`;
  const who = m.role === 'user' ? '你：' : m.role === 'bot_out' ? `→ ${esc((m.to || '').replace(/^bot:/, ''))}：` : '';
  return `<div class="pv"><span>${who}${esc(plain(m.text))}</span>${unread}</div>`;
}
function renderBots() {
  const q = state.filter.toLowerCase();
  const list = state.bots.filter(b => !q || `${b.name} ${b.id} ${b.description || ''}`.toLowerCase().includes(q));
  $('botCount').textContent = state.bots.length || '';
  $('bots').innerHTML = list.map(b => `<button class="item ${b.id === state.active ? 'on' : ''}" data-bot="${esc(b.id)}" title="${esc(b.description || b.name)}">${avatar(b.id, '', b.busy ? '<span class="busy"></span>' : '')}<div class="txt"><div class="nm"><span>${esc(b.name)}</span><time>${esc(short(state.last[b.id]?.createdAt))}</time></div>${preview(b)}</div></button>`).join('')
    || `<div class="none">${q ? '没有匹配的 Bot' : '还没有 Bot，点上面的 + 创建'}</div>`;
}

/* ---------- render: thread ---------- */
function renderHead() {
  const b = activeBot();
  $('detailBtn').disabled = !b;
  $('hdAv').innerHTML = b ? avatar(b.id) : '';
  $('hdName').textContent = b ? b.name : 'bot-hub';
  const st = $('hdState');
  st.classList.toggle('off', !state.online);
  if (!state.online) st.innerHTML = '<i></i>连接已断开，正在重试…';
  else if (b?.busy) st.innerHTML = `<i></i>${state.tool[b.id] ? `正在调用 ${esc(state.tool[b.id])}` : '正在思考'}${b.model ? ` · ${esc(b.model)}` : ''}`;
  else st.textContent = b ? [b.queued ? `排队 ${b.queued}` : '空闲', b.model].filter(Boolean).join(' · ') : '';
  $('input').placeholder = b ? `发消息给 ${b.name}` : '发消息';
  syncSend();
}

function msgHTML(m) {
  const fresh = state.seen.has(m.id) ? '' : ' fresh';
  const foot = [m.durationMs && `${(m.durationMs / 1000).toFixed(1)}s`, m.costUsd && `$${Number(m.costUsd).toFixed(4)}`].filter(Boolean).join(' · ');
  const footHTML = foot ? `<div class="foot">${foot}</div>` : '';
  switch (m.role) {
    case 'user': {
      const via = m.from && !['web', 'user', 'cli'].includes(m.from) ? `<div class="label">来自 ${esc(m.from)}</div>` : '';
      return `<div class="msg me${fresh}">${via}<div class="bubble">${md(m.text)}</div></div>`;
    }
    case 'assistant':
      return `<div class="msg bot${fresh}"><div class="bubble">${md(m.text)}</div>${footHTML}</div>`;
    case 'bot_out':
    case 'bot_in': {
      const out = m.role === 'bot_out';
      const peer = (out ? m.to : m.from || '').replace(/^bot:/, '');
      const label = out ? `发给 ${esc(peer)}` : `${esc(peer)} 回复`;
      return `<div class="msg bot peer${fresh}"><div class="label">${avatar(peer)}${label}</div><div class="bubble">${md(m.text)}</div>${footHTML}</div>`;
    }
    default:
      if (m.from === 'command') return `<div class="msg bot cmd${fresh}"><div class="bubble">${esc(m.text)}</div></div>`;
      return `<div class="msg sys ${m.from === 'error' ? 'err' : ''}${fresh}"><div class="note">${esc(m.text)}</div></div>`;
  }
}

function renderThread({ stick = false } = {}) {
  const b = activeBot();
  const sc = $('scroll');
  const nearBottom = sc.scrollHeight - sc.scrollTop - sc.clientHeight < 80;
  if (!b) {
    $('thread').innerHTML = `<div class="hello">${avatar('bot-hub')}<h2>还没有 Bot</h2><p>每个 Bot 有自己的 workspace、会话和记忆，彼此还能互相协作。</p><div class="sugs"><button class="sug p" data-open-create><b>新建 Bot</b><span>独立的 workspace 与会话</span></button></div></div>`;
    return;
  }
  const list = state.msgs[b.id] || [];
  let html = '';
  if (!list.length) {
    html = `<div class="hello">${avatar(b.id)}<h2>${esc(b.name)}</h2><p>${esc(b.description || '有什么可以帮你的？')}</p><div class="sugs">
      <button class="sug n" data-fill="你能做什么？"><b>你能做什么？</b><span>先了解一下</span></button>
      <button class="sug p" data-fill="/status"><b>/status</b><span>会话与费用</span></button>
      <button class="sug l" data-fill="/ask "><b>/ask</b><span>问问另一个 Bot</span></button>
      <button class="sug g" data-fill="/bots"><b>/bots</b><span>查看所有 Bot</span></button></div></div>`;
  } else {
    let prev = 0;
    for (const m of list) {
      const t = new Date(m.createdAt).getTime();
      if (!prev || t - prev > 10 * 60 * 1000) html += `<div class="stamp">${esc(stamp(m.createdAt))}</div>`;
      prev = t || prev;
      html += msgHTML(m);
    }
  }
  if (b.busy) {
    const tool = state.tool[b.id];
    html += `<div class="live">${avatar(b.id)}<span class="shimmer">${tool ? `正在调用 ${esc(tool)}` : '正在思考…'}</span></div>`;
  }
  $('thread').innerHTML = html;
  list.forEach(m => state.seen.add(m.id));
  if (!stick || nearBottom) sc.scrollTop = sc.scrollHeight;
}

/* ---------- data ---------- */
async function selectBot(id) {
  state.active = id;
  state.unread[id] = 0;
  try { localStorage.setItem('bothub.active', id); } catch {}
  closeAll();
  renderBots(); renderHead(); renderThread(); syncSend();
  await loadMessages(id, true);
  if (matchMedia('(min-width: 821px)').matches) $('input').focus();
}

async function loadBots() {
  const data = await api('/api/bots');
  state.bots = data.bots || [];
  let saved = null;
  try { saved = localStorage.getItem('bothub.active'); } catch {}
  if (!state.bots.some(b => b.id === state.active)) {
    state.active = state.bots.some(b => b.id === saved) ? saved : state.bots[0]?.id || null;
  }
  renderBots(); renderHead(); renderThread();
  if (state.active) await loadMessages(state.active, true);
  // last message of every other bot, for the sidebar previews
  await Promise.all(state.bots.filter(b => b.id !== state.active).map(async b => {
    try {
      const d = await api(`/api/bots/${encodeURIComponent(b.id)}/messages?limit=1`);
      const m = d.messages?.[d.messages.length - 1];
      if (m) state.last[b.id] = m;
    } catch {}
  }));
  renderBots();
}

async function loadMessages(id, initial = false) {
  try {
    const data = await api(`/api/bots/${encodeURIComponent(id)}/messages?limit=200`);
    state.msgs[id] = data.messages || [];
    const last = state.msgs[id][state.msgs[id].length - 1];
    if (last) state.last[id] = last;
    if (initial) state.msgs[id].forEach(m => state.seen.add(m.id));
    if (state.active === id) { renderThread(); renderBots(); }
  } catch (e) { if (e.message !== 'unauthorized') toast(e.message); }
}

function push(botId, msg) {
  const list = state.msgs[botId] || (state.msgs[botId] = []);
  if (msg.id && list.some(x => x.id === msg.id)) return;
  list.push(msg);
  if (msg.role !== 'system') state.last[botId] = msg;
  if (state.active === botId) renderThread({ stick: true });
  else if (msg.role !== 'system') state.unread[botId] = (state.unread[botId] || 0) + 1;
  renderBots();
}

async function send() {
  const id = state.active, text = $('input').value.trim();
  if (!id || !text) return;
  $('input').value = ''; resize();
  const local = (from, t) => push(id, { id: `${from}_${Date.now()}`, botId: id, role: 'system', from, text: t, createdAt: new Date().toISOString() });
  try {
    const data = await api(`/api/bots/${encodeURIComponent(id)}/message`, { method: 'POST', body: { message: text, source: 'web' } });
    if (/^\/(bots|status|reset)$/.test(text) && data.text) local('command', data.text);
    if (text === '/reset') loadBots();
  } catch (e) { if (e.message !== 'unauthorized' && !/interrupted$/.test(e.message)) local('error', e.message); }
}

/* ---------- live events ---------- */
let es;
function connect() {
  es?.close();
  es = new EventSource('/api/events');
  const set = ok => { if (state.online !== ok) { state.online = ok; renderHead(); } };
  es.addEventListener('ready', () => set(true));
  es.onerror = () => set(false);
  const on = (type, fn) => es.addEventListener(type, e => { try { fn(JSON.parse(e.data)); } catch {} });
  on('message', ({ payload: m }) => m?.botId && push(m.botId, m));
  on('bot_status', ({ payload: st }) => {
    if (!st) return;
    const i = state.bots.findIndex(b => b.id === st.id);
    if (i >= 0) state.bots[i] = st; else state.bots.push(st);
    if (!st.busy) delete state.tool[st.id];
    renderBots();
    if (state.active === st.id) { renderHead(); renderThread({ stick: true }); syncSend(); }
  });
  on('tool_use', ({ payload: p }) => {
    if (!p?.botId) return;
    state.tool[p.botId] = p.tool;
    renderBots();
    if (state.active === p.botId) { renderHead(); renderThread({ stick: true }); }
  });
  on('bot_created', ({ payload: st }) => {
    if (st && !state.bots.some(b => b.id === st.id)) { state.bots.push(st); renderBots(); }
  });
}

/* ---------- overlays ---------- */
function open(id) { $(id).classList.add('open'); }
function closeAll() {
  document.querySelectorAll('.dlg-wrap.open:not(#loginDlg), .panel.open, .side.open, .shade.open, .pop.open').forEach(el => el.classList.remove('open'));
}

async function openPanel() {
  const b = activeBot(); if (!b) return;
  try {
    const d = await api(`/api/bots/${encodeURIComponent(b.id)}`);
    $('pAv').innerHTML = avatar(d.id);
    $('pName').textContent = d.name;
    $('pDesc').textContent = d.description || '';
    $('pTurns').textContent = d.session?.turnCount || 0;
    $('pCost').textContent = '$' + (d.session?.totalCostUsd || 0).toFixed(2);
    $('pState').textContent = d.busy ? '工作中' : '空闲';
    $('pId').textContent = d.id;
    $('pHarness').textContent = harnessLabel(d.harness);
    $('pModel').textContent = (d.model || '—') + (d.modelInherited ? '（默认）' : '');
    $('pSession').textContent = d.session?.sessionId || '—';
    $('pWs').textContent = d.workspace;
    $('pInst').textContent = d.instructions || '(空)';
    open('panel'); open('shade');
  } catch (e) { if (e.message !== 'unauthorized') toast(e.message); }
}

function askReset() {
  const b = activeBot(); if (!b) return;
  $('confirmText').textContent = `${b.name} 会开始一个新会话，之前的上下文不再带入。Workspace 和 memory/ 保留不动。`;
  open('confirmDlg');
}

function resize() {
  const el = $('input');
  el.style.height = 'auto';
  if (el.value) el.style.height = Math.min(el.scrollHeight, 220) + 'px';
  syncSend();
}
function syncSend() {
  const b = activeBot(), btn = $('sendBtn');
  const stop = !!b?.busy && !$('input').value.trim();
  btn.classList.toggle('stop', stop);
  btn.setAttribute('aria-label', stop ? '停止' : '发送');
  btn.innerHTML = stop
    ? '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="7" y="7" width="10" height="10" rx="2"/></svg>'
    : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>';
  btn.disabled = !stop && (!$('input').value.trim() || !b);
}
async function interrupt() {
  const id = state.active; if (!id) return;
  try { const r = await api(`/api/bots/${encodeURIComponent(id)}/interrupt`, { method: 'POST' }); if (!r.interrupted) toast('当前没有在运行'); }
  catch (e) { if (e.message !== 'unauthorized') toast(e.message); }
}

/* ---------- wiring ---------- */
document.addEventListener('click', e => {
  if (!e.target.closest('#pop, #plusBtn')) $('pop').classList.remove('open');
  const t = e.target.closest('[data-bot],[data-close],[data-fill],[data-cmd],[data-copy],[data-open-create]');
  if (!t) return;
  if (t.dataset.bot) selectBot(t.dataset.bot);
  else if (t.hasAttribute('data-close')) closeAll();
  else if (t.hasAttribute('data-open-create')) $('openCreate').click();
  else if (t.dataset.fill || t.dataset.cmd) {
    $('pop').classList.remove('open');
    const el = $('input'); el.value = t.dataset.fill || t.dataset.cmd; resize(); el.focus();
    el.setSelectionRange(el.value.length, el.value.length);
  } else if (t.hasAttribute('data-copy')) {
    const code = t.closest('.code').querySelector('code').textContent;
    navigator.clipboard?.writeText(code).then(() => { t.textContent = '已复制'; setTimeout(() => t.textContent = '复制', 1200); });
  }
});
document.querySelectorAll('.dlg-wrap').forEach(w => w.addEventListener('mousedown', e => { if (e.target === w && w.id !== 'loginDlg') closeAll(); }));
$('shade').onclick = closeAll;
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeAll();
  if ((e.metaKey || e.ctrlKey) && e.key === 'k') { e.preventDefault(); $('filter').focus(); }
});

$('menuBtn').onclick = () => { open('side'); open('shade'); };
$('plusBtn').onclick = () => $('pop').classList.toggle('open');
$('filter').oninput = e => { state.filter = e.target.value; renderBots(); };
$('filter').onkeydown = e => {
  if (e.key === 'Escape' && e.target.value) { e.stopPropagation(); e.target.value = ''; state.filter = ''; renderBots(); }
  if (e.key === 'Enter') { const first = document.querySelector('.side [data-bot]'); if (first) selectBot(first.dataset.bot); }
};
$('input').addEventListener('input', resize);
$('input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); }
});
$('sendBtn').onclick = () => $('sendBtn').classList.contains('stop') ? interrupt() : send();
$('detailBtn').onclick = openPanel;
$('pReset').onclick = () => { closeAll(); askReset(); };
$('confirmOk').onclick = async () => {
  const id = state.active; closeAll();
  try { await api(`/api/bots/${encodeURIComponent(id)}/reset`, { method: 'POST' }); toast('已开始新会话'); await loadBots(); }
  catch (e) { if (e.message !== 'unauthorized') toast(e.message); }
};

const syncCreateAvatar = () => { $('cAv').innerHTML = avatar($('fId').value || 'new'); };
$('remoteBtn').onclick = async () => {
  closeAll(); open('remoteDlg');
  const t = await api('/api/tailcat').catch(err => ({ state: 'error', error: err.message }));
  const ready = t.state === 'ready';
  $('remoteState').textContent = { disabled: '未开启', connecting: '正在连接中继…', ready: '已就绪', error: '出错' }[t.state] || t.state;
  $('remoteQR').style.display = $('remoteLinkFld').style.display = $('remoteCopy').style.display = ready ? '' : 'none';
  if (ready) { $('remoteQR').src = '/api/tailcat/qr.png?t=' + Date.now(); $('remoteLink').value = t.link; }
  $('remoteHelp').textContent = ready
    ? '链接即密钥，只发给自己的设备。在另一台电脑的 Bot Hub 桌面版选「连接远端」粘贴，或运行 bot-hub connect <链接>；进入后仍需 apiToken。'
    : t.state === 'disabled' ? '在 config 的 http 中加入 "tailcat": {"enabled": true}（需先设置 apiToken）后重启。'
    : (t.error || '稍后再打开查看。');
};
$('remoteCopy').onclick = () => navigator.clipboard.writeText($('remoteLink').value);
$('openCreate').onclick = () => {
  $('createForm').reset(); $('createErr').textContent = ''; delete $('fId').dataset.touched;
  syncCreateAvatar();
  closeAll(); open('createDlg'); setTimeout(() => $('fName').focus(), 30);
  loadSettings().then(() => { fillHarnessSelect($('fHarness'), 'opencode'); syncCreateModel(); }).catch(() => {});
};
const syncCreateModel = () => {
  const h = $('fHarness').value;
  $('fModel').setAttribute('list', 'models-' + h);
  $('fModel').placeholder = defaultFor(h) ? `默认 ${defaultFor(h)}` : 'provider/model';
  loadModels(h);
};
$('fHarness').onchange = () => { $('fModel').value = ''; syncCreateModel(); };

/* ---------- settings ---------- */
const harnessLabel = id => state.settings?.harnesses.find(h => h.id === id)?.label || id || 'opencode';
const defaultFor = h => state.settings?.harnesses.find(x => x.id === h)?.defaultModel || '';
async function loadSettings() {
  state.settings = await api('/api/settings');
  for (const h of state.settings.harnesses) {
    if (!$('models-' + h.id)) $('modelLists').insertAdjacentHTML('beforeend', `<datalist id="models-${esc(h.id)}"></datalist>`);
  }
  return state.settings;
}
async function loadModels(h) {
  if (state.models[h]) return;
  state.models[h] = [];
  try {
    const d = await api(`/api/models?harness=${encodeURIComponent(h)}`);
    state.models[h] = d.models || [];
    $('models-' + h).innerHTML = state.models[h].map(m => `<option value="${esc(m)}"></option>`).join('');
  } catch { delete state.models[h]; }
}
function fillHarnessSelect(sel, value) {
  sel.innerHTML = state.settings.harnesses.map(h => `<option value="${esc(h.id)}">${esc(h.label)}</option>`).join('');
  sel.value = value || 'opencode';
}
function botRow(b) {
  return `<div class="brow" data-row="${esc(b.id)}">${avatar(b.id)}<div class="nm" title="${esc(b.id)}">${esc(b.name)}</div>
    <select data-h></select><input data-m spellcheck="false" /></div>`;
}
function syncRow(row, b) {
  const h = row.querySelector('[data-h]').value, m = row.querySelector('[data-m]');
  m.setAttribute('list', 'models-' + h);
  m.placeholder = defaultFor(h) ? `默认 ${defaultFor(h)}` : '填写模型';
  loadModels(h);
}
async function openSettings() {
  closeAll();
  $('settingsErr').textContent = '';
  try { await loadSettings(); } catch (e) { if (e.message !== 'unauthorized') toast(e.message); return; }
  const s = state.settings;
  const self = s.modelAccess === 'self', installed = s.magpie?.installed;
  $('sMode').querySelectorAll('[data-mode]').forEach(b => { b.classList.toggle('on', b.dataset.mode === s.modelAccess); b.disabled = false; });
  $('sModeHint').textContent = self ? '各 CLI 用自己的 provider 配置，bot-hub 不读也不改 magpie'
    : installed ? '模型目录来自 magpie，可一键把 CLI 接到 magpie 网关' : '';
  const inst = s.magpie?.install || {};
  const cmd = c => `<div class="cmd"><code>${esc(c)}</code><button type="button" data-copy="${esc(c)}">复制</button></div>`;
  $('sMagpie').hidden = self || installed;
  $('sMagpie').innerHTML = `<div>未检测到 magpie。在终端安装后重新打开设置：</div>${cmd(inst.script || '')}${cmd(inst.brew || '')}
    <div>或 <a href="${esc(inst.download || '')}" target="_blank" rel="noopener">下载安装包</a> · <a href="${esc(inst.docs || '')}" target="_blank" rel="noopener">使用文档</a>。不用 magpie 就切到「自托管」。</div>`;
  $('sMagpie').querySelectorAll('[data-copy]').forEach(b => b.onclick = async () => {
    try { await navigator.clipboard.writeText(b.dataset.copy); toast('已复制'); } catch { toast('复制失败，请手动选择'); }
  });
  const viaMagpie = !self && installed;
  const tag = h => !viaMagpie ? (['opencode', 'pi'].includes(h.id) ? '留空用通用' : '可选')
    : h.magpie.connected ? '<span class="mp ok">magpie 已接入</span>'
    : `<button type="button" class="mp" data-magpie="${esc(h.id)}" title="运行 magpie ${esc(h.id)} <模型>，会改这个 CLI 的全局配置">接入 magpie</button>`;
  $('sDefaults').innerHTML = `<div class="fld"><label>通用 <em>${viaMagpie ? 'magpie 模型适用全部' : 'opencode · pi'}</em></label><input data-def="" class="mono" spellcheck="false" list="models-opencode" value="${esc(s.defaultModel || '')}" /></div>`
    + s.harnesses.map(h => `<div class="fld"><label>${esc(h.label)} <em>${tag(h)}</em></label><input data-def="${esc(h.id)}" class="mono" spellcheck="false" list="models-${esc(h.id)}" value="${esc(s.defaultModels?.[h.id] || '')}" placeholder="${esc(h.defaultModel ? '默认 ' + h.defaultModel : '')}" /></div>`).join('');
  $('sDefaults').querySelectorAll('[data-magpie]').forEach(b => b.onclick = async () => {
    b.disabled = true; b.textContent = '接入中…';
    try {
      const id = b.dataset.magpie;
      const model = $('sDefaults').querySelector(`[data-def="${id}"]`).value.trim() || $('sDefaults').querySelector('[data-def=""]').value.trim();
      state.settings = await api(`/api/harnesses/${encodeURIComponent(id)}/magpie`, { method: 'POST', body: { model } });
      toast('已接入 magpie'); openSettings();
    } catch (e) { b.disabled = false; b.textContent = '接入 magpie'; if (e.message !== 'unauthorized') $('settingsErr').textContent = e.message; }
  });
  $('sBots').innerHTML = state.bots.map(botRow).join('') || '<div class="sub">还没有 Bot</div>';
  for (const b of state.bots) {
    const row = $('sBots').querySelector(`[data-row="${CSS.escape(b.id)}"]`);
    fillHarnessSelect(row.querySelector('[data-h]'), b.harness);
    row.querySelector('[data-m]').value = b.modelInherited ? '' : (b.model || '');
    syncRow(row, b);
    row.querySelector('[data-h]').onchange = () => { row.querySelector('[data-m]').value = ''; syncRow(row, b); };
  }
  s.harnesses.forEach(h => loadModels(h.id));
  open('settingsDlg');
}
$('settingsBtn').onclick = openSettings;
$('sMode').querySelectorAll('[data-mode]').forEach(b => b.onclick = async () => {
  const s = state.settings;
  if (!s || b.dataset.mode === s.modelAccess) return;
  $('sMode').querySelectorAll('button').forEach(x => x.disabled = true);
  try {
    await api('/api/settings', { method: 'PUT', body: { modelAccess: b.dataset.mode, defaultModel: s.defaultModel || '', defaultModels: s.defaultModels || {} } });
    state.models = {};
    $('modelLists').querySelectorAll('datalist').forEach(d => d.innerHTML = '');
    openSettings();
  } catch (e) { $('sMode').querySelectorAll('button').forEach(x => x.disabled = false); if (e.message !== 'unauthorized') $('settingsErr').textContent = e.message; }
}));
$('settingsForm').onsubmit = async e => {
  e.preventDefault();
  $('settingsSubmit').disabled = true;
  try {
    const defs = {}; let general = '';
    $('sDefaults').querySelectorAll('[data-def]').forEach(i => { const v = i.value.trim(); if (!i.dataset.def) general = v; else if (v) defs[i.dataset.def] = v; });
    const s = state.settings;
    const changedDefs = general !== (s.defaultModel || '') || JSON.stringify(defs) !== JSON.stringify(Object.fromEntries(Object.entries(s.defaultModels || {}).filter(([, v]) => v)));
    if (changedDefs) await api('/api/settings', { method: 'PUT', body: { defaultModel: general, defaultModels: defs } });
    for (const b of state.bots) {
      const row = $('sBots').querySelector(`[data-row="${CSS.escape(b.id)}"]`);
      const h = row.querySelector('[data-h]').value, m = row.querySelector('[data-m]').value.trim();
      const cur = b.modelInherited ? '' : (b.model || '');
      if (h === b.harness && m === cur) continue;
      const st = await api(`/api/bots/${encodeURIComponent(b.id)}`, { method: 'PATCH', body: { harness: h, model: m } });
      Object.assign(b, st);
    }
    closeAll(); toast('已保存'); await loadBots();
  } catch (err) { if (err.message !== 'unauthorized') $('settingsErr').textContent = err.message; }
  finally { $('settingsSubmit').disabled = false; }
};
$('fName').addEventListener('input', () => {
  if ($('fId').dataset.touched) return;
  $('fId').value = $('fName').value.trim().toLowerCase().replace(/[^a-z0-9_-]+/g, '-').replace(/^-+|-+$/g, '');
  syncCreateAvatar();
});
$('fId').addEventListener('input', () => { $('fId').dataset.touched = '1'; syncCreateAvatar(); });
$('createForm').onsubmit = async e => {
  e.preventDefault();
  const body = { id: $('fId').value.trim(), name: $('fName').value.trim(), description: $('fDesc').value.trim(), harness: $('fHarness').value, model: $('fModel').value.trim(), instructions: $('fInst').value.trim() };
  $('createSubmit').disabled = true;
  try {
    const st = await api('/api/bots', { method: 'POST', body });
    closeAll();
    if (!state.bots.some(b => b.id === st.id)) state.bots.push(st);
    toast(`${st.name} 已上线`);
    await selectBot(st.id);
  } catch (err) { $('createErr').textContent = err.message; }
  finally { $('createSubmit').disabled = false; }
};

$('loginForm').onsubmit = async e => {
  e.preventDefault();
  try {
    await api('/api/login', { method: 'POST', body: { token: $('loginToken').value } });
    $('loginToken').value = ''; $('loginErr').textContent = ''; $('loginDlg').classList.remove('open');
    connect(); await loadBots();
  } catch (err) { $('loginErr').textContent = err.message; }
};

loadSettings().catch(() => {});
loadBots().then(connect).catch(() => {});
resize();
</script>
</body>
</html>
