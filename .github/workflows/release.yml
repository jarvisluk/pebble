name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build (defaults to tag in version.json)"
        required: false
        type: string
      draft:
        description: "Publish as draft GitHub Release"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve and verify release version
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ -n "${{ inputs.tag }}" ]; then
              TAG="${{ inputs.tag }}"
            else
              TAG="$(python3 scripts/version.py show --field tag)"
            fi
          else
            TAG="${{ github.ref_name }}"
          fi
          git checkout "$TAG"
          python3 scripts/version.py check --expect-tag "$TAG"
          VERSION="$(python3 scripts/version.py show --field version)"
          PRERELEASE="$(python3 scripts/version.py show --field prerelease)"
          {
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo "prerelease=$PRERELEASE"
          } >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        run: |
          python3 scripts/version.py changelog \
            --to "${{ steps.meta.outputs.tag }}" \
            --version "${{ steps.meta.outputs.version }}" \
            --no-header > release-notes.md
          cat release-notes.md

      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md

  build-cli-linux:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build Web UI
        run: cd web && npm ci && npm run build

      - name: Build Linux CLI tarballs
        env:
          PLATFORMS: linux/amd64 linux/arm64
        run: ./scripts/release/build-cli.sh --skip-web --version "${{ needs.prepare.outputs.version }}"

      - uses: actions/upload-artifact@v4
        with:
          name: release-cli-linux
          path: dist/release/${{ needs.prepare.outputs.version }}/*

  build-macos:
    needs: prepare
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build Web UI and install bundled desktop tools
        run: |
          cd web && npm ci && npm run build
          npm install -g agent-desktop agent-browser

      - name: Configure optional Apple Developer ID signing & notarization
        env:
          APPLE_DEVELOPER_ID_CERT_P12: ${{ secrets.APPLE_DEVELOPER_ID_CERT_P12 }}
          APPLE_DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERT_PASSWORD }}
          APPLE_NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          if [ -n "$APPLE_DEVELOPER_ID_CERT_P12" ] && [ -n "$APPLE_DEVELOPER_ID_CERT_PASSWORD" ]; then
            KC_PATH="$RUNNER_TEMP/pebble-signing.keychain-db"
            KC_PASS="$(openssl rand -hex 16)"
            P12_PATH="$RUNNER_TEMP/dev-id.p12"
            printf '%s' "$APPLE_DEVELOPER_ID_CERT_P12" | base64 --decode > "$P12_PATH"
            security create-keychain -p "$KC_PASS" "$KC_PATH"
            security set-keychain-settings -lut 21600 "$KC_PATH"
            security unlock-keychain -p "$KC_PASS" "$KC_PATH"
            security import "$P12_PATH" -k "$KC_PATH" -P "$APPLE_DEVELOPER_ID_CERT_PASSWORD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PASS" "$KC_PATH"
            security list-keychains -d user -s "$KC_PATH" login.keychain
            IDENTITY="$(security find-identity -v -p codesigning "$KC_PATH" | awk '/Developer ID Application:/ {print $2; exit}')"
            rm -f "$P12_PATH"
            if [ -n "$IDENTITY" ]; then
              echo "CODESIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
              echo "PEBBLE_TEMP_KEYCHAIN=$KC_PATH" >> "$GITHUB_ENV"
            fi
          else
            echo "note: APPLE_DEVELOPER_ID_CERT_P12 not set; using ad-hoc signing fallback"
          fi

          if [ -n "$APPLE_NOTARY_KEY_BASE64" ] && [ -n "$APPLE_NOTARY_KEY_ID" ] && [ -n "$APPLE_NOTARY_ISSUER_ID" ]; then
            NOTARY_KEY="$RUNNER_TEMP/AuthKey_${APPLE_NOTARY_KEY_ID}.p8"
            printf '%s' "$APPLE_NOTARY_KEY_BASE64" | base64 --decode > "$NOTARY_KEY"
            echo "APPLE_NOTARY_KEY_PATH=$NOTARY_KEY" >> "$GITHUB_ENV"
          fi

      - name: Build macOS CLI tarballs
        env:
          PLATFORMS: darwin/arm64 darwin/amd64
        run: ./scripts/release/build-cli.sh --skip-web --version "${{ needs.prepare.outputs.version }}"

      - name: Package Pebble.app (.zip and .dmg)
        env:
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_NOTARY_APPLE_ID: ${{ secrets.APPLE_NOTARY_APPLE_ID }}
          APPLE_NOTARY_TEAM_ID: ${{ secrets.APPLE_NOTARY_TEAM_ID }}
          APPLE_NOTARY_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
        run: ./scripts/release/package-macos.sh --skip-web --version "${{ needs.prepare.outputs.version }}"

      - name: Cleanup temporary signing credentials
        if: always()
        run: |
          if [ -n "${PEBBLE_TEMP_KEYCHAIN:-}" ] && [ -f "$PEBBLE_TEMP_KEYCHAIN" ]; then
            security delete-keychain "$PEBBLE_TEMP_KEYCHAIN" || true
          fi
          rm -f "$RUNNER_TEMP"/AuthKey_*.p8 "$RUNNER_TEMP/dev-id.p12"

      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: dist/release/${{ needs.prepare.outputs.version }}/*

  build-android:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Ensure Android NDK is installed
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -z "${ANDROID_NDK_HOME:-}" ]; then
            if [ -d "$SDK_ROOT/ndk" ] && [ -n "$(ls -A "$SDK_ROOT/ndk" 2>/dev/null)" ]; then
              NDK_DIR="$(find "$SDK_ROOT/ndk" -maxdepth 1 -mindepth 1 | sort -V | tail -n 1)"
            else
              yes | sdkmanager --licenses >/dev/null || true
              sdkmanager "ndk;27.2.12479018"
              NDK_DIR="$SDK_ROOT/ndk/27.2.12479018"
            fi
            echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          fi

      - name: Configure optional Android release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            KS_PATH="$RUNNER_TEMP/pebble-release.jks"
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KS_PATH"
            echo "PEBBLE_KEYSTORE_PATH=$KS_PATH" >> "$GITHUB_ENV"
          else
            echo "note: ANDROID_KEYSTORE_BASE64 not set; falling back to debug signing"
          fi

      - name: Build Android Release APK
        env:
          PEBBLE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          PEBBLE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          PEBBLE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./scripts/release/package-android.sh --version "${{ needs.prepare.outputs.version }}"

      - name: Cleanup temporary keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/pebble-release.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: dist/release/${{ needs.prepare.outputs.version }}/*

  publish:
    needs: [prepare, build-cli-linux, build-macos, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: release-notes

      - uses: actions/download-artifact@v4
        with:
          name: release-cli-linux
          path: dist/release/${{ needs.prepare.outputs.version }}

      - uses: actions/download-artifact@v4
        with:
          name: release-macos
          path: dist/release/${{ needs.prepare.outputs.version }}

      - uses: actions/download-artifact@v4
        with:
          name: release-android
          path: dist/release/${{ needs.prepare.outputs.version }}

      - name: Generate SHA256SUMS.txt
        run: ./scripts/release/checksums.sh "dist/release/${{ needs.prepare.outputs.version }}"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.prepare.outputs.tag }}"
          DIR="dist/release/${{ needs.prepare.outputs.version }}"
          ARGS=("$TAG" "--title" "$TAG" "--notes-file" "release-notes/release-notes.md")
          if [ "${{ needs.prepare.outputs.prerelease }}" = "true" ]; then
            ARGS+=("--prerelease")
          fi
          if [ "${{ inputs.draft }}" = "true" ]; then
            ARGS+=("--draft")
          fi
          ASSETS=()
          while IFS= read -r f; do
            ASSETS+=("$f")
          done < <(find "$DIR" -maxdepth 1 -type f | LC_ALL=C sort)

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
            gh release edit "$TAG" --notes-file "release-notes/release-notes.md"
          else
            gh release create "${ARGS[@]}" "${ASSETS[@]}"
          fi
