<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pebble</title>
<style>
  :root {
    --page: #efece8;
    --card: #ffffff;
    --s1: #f5f3f0;
    --s2: #e9e5e0;
    --s3: #dcd7d0;
    --text: #1d1b19;
    --text-2: #57524d;
    --mute: #9b958f;
    --accent: #d9774b;
    --accent-text: #ffffff;
    --sage: #e2e9cc;
    --sage-ink: #6b8a2a;
    --danger: #d9483b;
    --r-card: 24px;
    --r-row: 12px;
    --fs-xl: 20px;
    --fs-lg: 17px;
    --fs-md: 15px;
    --fs-base: 14px;
    --fs-sm: 13px;
    --fs-xs: 12px;
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Hiragino Sans GB", "Segoe UI", "Microsoft YaHei", sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --page: #000000;
      --card: #171717;
      --s1: #232323;
      --s2: #303030;
      --s3: #404040;
      --text: #f3f1ee;
      --text-2: #ccc7c1;
      --mute: #948e88;
      --sage: #171717;
      --sage-ink: #a9c46a;
      --danger: #f0605a;
    }
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    font-family: var(--font);
    font-size: var(--fs-base);
    line-height: 1.6;
    background: var(--page);
    color: var(--text);
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 52px 24px 24px;
    overflow-x: hidden;
  }
  #dragBar {
    position: fixed;
    top: 8px;
    left: 76px;
    right: 8px;
    height: 36px;
    --wails-draggable: drag;
  }
  main {
    width: min(560px, 100%);
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .head {
    padding: 0 4px 4px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  h1 {
    font-size: var(--fs-xl);
    font-weight: 700;
    line-height: 1.3;
  }
  .sub {
    color: var(--text-2);
    font-size: var(--fs-sm);
  }
  .card {
    background: var(--card);
    border: 0;
    border-radius: var(--r-card);
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .card-hd {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .card h2 {
    font-size: var(--fs-md);
    font-weight: 700;
  }
  .desc {
    color: var(--text-2);
    font-size: var(--fs-sm);
    line-height: 1.5;
  }
  .meta-row {
    background: var(--s1);
    border-radius: var(--r-row);
    padding: 8px 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    font-size: var(--fs-sm);
  }
  .meta-row .lbl {
    color: var(--text-2);
    flex: 1;
    min-width: 0;
  }
  .meta-row .lbl.ok {
    color: var(--sage-ink);
    font-weight: 600;
  }
  .mp {
    height: 24px;
    border: 0;
    border-radius: 999px;
    padding: 0 12px;
    font-family: var(--font);
    font-size: var(--fs-xs);
    font-weight: 600;
    background: var(--card);
    color: var(--text-2);
    cursor: pointer;
    flex-shrink: 0;
    transition: background 0.15s ease;
  }
  .mp:hover { background: var(--s2); }
  textarea {
    width: 100%;
    min-height: 72px;
    resize: vertical;
    background: var(--s1);
    color: var(--text);
    border: 1px solid transparent;
    border-radius: var(--r-row);
    padding: 8px 12px;
    font: var(--fs-sm)/1.5 var(--mono);
    outline: none;
    transition: border-color 0.15s ease;
  }
  textarea::placeholder {
    color: var(--mute);
    font-family: var(--font);
  }
  textarea:hover { border-color: var(--s2); }
  textarea:focus { border-color: var(--accent); }
  .hint {
    font-size: var(--fs-xs);
    color: var(--mute);
  }
  .hint.ok {
    color: var(--sage-ink);
  }
  .btn {
    align-self: flex-start;
    height: 36px;
    border: 0;
    border-radius: 999px;
    padding: 0 20px;
    font-family: var(--font);
    font-size: var(--fs-base);
    font-weight: 600;
    background: var(--accent);
    color: var(--accent-text);
    cursor: pointer;
    transition: opacity 0.15s ease, transform 0.15s ease;
  }
  .btn:hover:not(:disabled) { opacity: 0.92; }
  .btn:active:not(:disabled) { transform: scale(0.98); }
  .btn:disabled { opacity: 0.5; cursor: default; }
  .btn:focus-visible, .mp:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  code {
    font-family: var(--mono);
    font-size: var(--fs-xs);
    color: var(--text-2);
    word-break: break-all;
  }
  #status {
    min-height: 20px;
    padding: 0 4px;
    font-size: var(--fs-sm);
    color: var(--text-2);
  }
  #status.warn { color: var(--danger); }
</style>
</head>
<body>
<div id="dragBar"></div>
<main>
  <header class="head">
    <h1>Pebble</h1>
    <p class="sub" data-i18n="sub">选择这台电脑的使用方式，之后可从菜单栏图标「切换模式」更改</p>
  </header>

  <section class="card">
    <div class="card-hd">
      <h2 data-i18n="localTitle">在这台电脑上运行</h2>
    </div>
    <p class="desc"><span data-i18n="localDesc">在本机启动服务并打开开箱引导，数据保存在 </span><code id="dir"></code></p>
    <div class="meta-row">
      <span id="harnessSummary" class="lbl" data-i18n="detecting">正在检测本机 Agent 引擎…</span>
      <button type="button" id="recheck" class="mp" data-i18n="recheck">重新检测</button>
    </div>
    <button type="button" id="local" class="btn" data-i18n="localBtn">本机运行</button>
  </section>

  <section class="card">
    <div class="card-hd">
      <h2 data-i18n="remoteTitle">连接远端 Pebble</h2>
    </div>
    <p class="desc" data-i18n="remoteDesc">粘贴主电脑「远程访问」中的 tailcat:// 配对链接，无需安装 Tailscale。</p>
    <textarea id="link" placeholder="tailcat://connect/tc…?port=3789" spellcheck="false"></textarea>
    <p id="linkHint" class="hint" data-i18n="linkHint">支持携带 #token= 的完整配对链接</p>
    <button type="button" id="remote" class="btn" data-i18n="remoteBtn">连接</button>
  </section>

  <p id="status"></p>
</main>
<script>
const $ = id => document.getElementById(id);
const langPref = (() => { try { return localStorage.getItem('bothub.lang'); } catch { return ''; } })();
const isEn = langPref === 'en' || (langPref !== 'zh-CN' && !/^zh\b/i.test(navigator.language || ''));
const dict = isEn ? {
  sub: 'Choose how to use this computer (switch anytime from the menu bar icon)',
  localTitle: 'Run on this computer',
  localDesc: 'Start the local service and unbox wizard; data is stored in ',
  detecting: 'Detecting local agent harnesses…',
  recheck: 'Re-check',
  detectedPrefix: 'Detected: ',
  noneDetected: 'No installed agent harness detected; setup wizard will guide installation',
  localBtn: 'Run Locally',
  remoteTitle: 'Connect to remote Pebble',
  remoteDesc: 'Paste the tailcat:// pairing link from Remote Access. No Tailscale install needed.',
  linkHint: 'Supports full pairing links containing #token=',
  tokenDetected: 'Access token detected from link',
  remoteBtn: 'Connect',
  starting: 'Starting…',
  startFailed: 'Start failed',
} : null;
if (isEn) {
  document.documentElement.lang = 'en';
  document.querySelectorAll('[data-i18n]').forEach(el => { if (dict[el.dataset.i18n]) el.textContent = dict[el.dataset.i18n]; });
}
let polling = false;
function syncLinkHint() {
  const v = $('link').value.trim();
  const hasTok = v.includes('#token=') || v.includes('token=');
  $('linkHint').textContent = hasTok
    ? (isEn ? dict.tokenDetected : '已从链接识别访问口令')
    : (isEn ? dict.linkHint : '支持携带 #token= 的完整配对链接');
  $('linkHint').className = hasTok ? 'hint ok' : 'hint';
}
async function refresh() {
  const s = await (await fetch('/api/desktop')).json();
  $('dir').textContent = s.dataDir || '';
  const installed = Array.isArray(s.harnesses) ? s.harnesses.filter(h => h.installed) : [];
  if (installed.length > 0) {
    const sep = isEn ? ', ' : '、';
    $('harnessSummary').textContent = (isEn ? dict.detectedPrefix : '已检测到：') + installed.map(h => h.label).join(sep);
    $('harnessSummary').className = 'lbl ok';
  } else {
    $('harnessSummary').textContent = isEn ? dict.noneDetected : '未检测到已安装的 Agent 引擎，进入后将引导安装';
    $('harnessSummary').className = 'lbl';
  }
  if (!$('link').value && s.link) {
    $('link').value = s.link;
  }
  syncLinkHint();
  const st = s.status || '';
  $('status').textContent = st;
  $('status').className = st.startsWith('启动失败') || st.startsWith('Start failed') ? 'warn' : '';
  const busy = st === '正在启动…' || st === 'Starting…';
  $('local').disabled = $('remote').disabled = busy;
  return busy;
}
async function start(body) {
  $('status').textContent = isEn ? dict.starting : '正在启动…';
  $('status').className = '';
  $('local').disabled = $('remote').disabled = true;
  await fetch('/api/desktop/start', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  if (polling) return;
  polling = true;
  while (true) {
    await new Promise(r => setTimeout(r, 700));
    if (!(await refresh())) break;
  }
  polling = false;
}
$('recheck').onclick = () => { refresh().catch(() => {}); };
$('link').oninput = syncLinkHint;
$('local').onclick = () => start({ mode: 'local' });
$('remote').onclick = () => start({ mode: 'remote', link: $('link').value.trim() });
(() => {
  let dragArmed = false;
  $('dragBar').addEventListener('mousedown', e => {
    dragArmed = e.button === 0 && e.detail === 1;
  });
  document.addEventListener('mousemove', e => {
    if (!dragArmed || !(e.buttons & 1)) { dragArmed = false; return; }
    dragArmed = false;
    window.webkit?.messageHandlers?.external?.postMessage('wails:drag');
  });
  document.addEventListener('mouseup', () => { dragArmed = false; });
  window.addEventListener('blur', () => { dragArmed = false; });
  $('dragBar').addEventListener('dblclick', e => {
    if (window.webkit?.messageHandlers?.external) {
      e.preventDefault();
      window.webkit.messageHandlers.external.postMessage('wails:drag:doubleclick');
    }
  });
})();
refresh().catch(() => {});
</script>
</body>
</html>
