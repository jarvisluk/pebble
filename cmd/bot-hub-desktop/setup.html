<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Bot Hub</title>
<style>
  :root {
    --bg: #0f0f0f; --s1: #1f1f1f; --s2: #2a2a2a; --line: #262626;
    --text: #ececec; --text-2: #b4b4b4; --mute: #858585; --me: #1fa25e; --danger: #f2555a;
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Segoe UI", "Microsoft YaHei", sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #fff; --s1: #f1f1f0; --s2: #e7e7e5; --line: #ebebea; --text: #191919; --text-2: #4b4b4b; --mute: #8b8b8b; --me: #1d9a59; }
  }
  * { box-sizing: border-box; margin: 0; }
  body { font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100vh; display: grid; place-items: center; padding: 52px 24px 24px; overflow-x: hidden; }
  main { width: min(560px, 100%); display: flex; flex-direction: column; gap: 14px; }
  h1 { font-size: 26px; font-weight: 600; }
  .sub { color: var(--mute); font-size: 14px; margin-bottom: 6px; }
  .card { background: var(--s1); border: 1px solid var(--line); border-radius: 18px; padding: 18px 20px; display: flex; flex-direction: column; gap: 10px; }
  .card h2 { font-size: 16px; font-weight: 600; }
  .card p { color: var(--text-2); font-size: 13.5px; line-height: 1.55; }
  textarea { width: 100%; min-height: 70px; resize: vertical; background: var(--bg); color: var(--text); border: 1px solid var(--s2); border-radius: 12px; padding: 9px 12px; font: 12.5px/1.5 var(--mono); outline: none; }
  textarea:focus { border-color: var(--me); }
  button { align-self: flex-start; border: 0; border-radius: 999px; padding: 9px 20px; font: 14px var(--font); background: var(--me); color: #fff; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  .warn { color: var(--danger); }
  #status { min-height: 20px; font-size: 14px; color: var(--text-2); }
  code { font-family: var(--mono); font-size: 12px; color: var(--mute); word-break: break-all; }
</style>
</head>
<body>
<div id="dragBar" style="position:fixed;top:8px;left:76px;right:8px;height:36px;--wails-draggable:drag"></div>
<main>
  <div><h1>Bot Hub</h1><p class="sub" data-i18n="sub">选择这台电脑的用法，之后可从菜单栏图标「切换模式」</p></div>

  <section class="card">
    <h2 data-i18n="localTitle">在这台电脑上运行</h2>
    <p><span data-i18n="localDesc">Bot 在本机运行，数据保存在 </span><code id="dir"></code></p>
    <p id="ocWarn" class="warn" hidden data-i18n="ocWarn">没有找到 opencode：请先安装 OpenCode 再选这一项。</p>
    <button id="local" data-i18n="localBtn">本机运行</button>
  </section>

  <section class="card">
    <h2 data-i18n="remoteTitle">连接远端 Bot Hub</h2>
    <p data-i18n="remoteDesc">粘贴远端「远程访问」里的 tailcat:// 链接。不需要安装 Tailscale。</p>
    <textarea id="link" placeholder="tailcat://connect/tc…?port=3789" spellcheck="false"></textarea>
    <button id="remote" data-i18n="remoteBtn">连接</button>
  </section>

  <p id="status"></p>
</main>
<script>
const $ = id => document.getElementById(id);
const langPref = (() => { try { return localStorage.getItem('bothub.lang'); } catch { return ''; } })();
const isEn = langPref === 'en' || (langPref !== 'zh-CN' && !/^zh\b/i.test(navigator.language || ''));
const dict = isEn ? {
  sub: 'Choose how to use this computer (switch anytime from the menu bar icon)',
  localTitle: 'Run on this computer',
  localDesc: 'Bots run locally and store data in ',
  ocWarn: 'opencode not found: install OpenCode before choosing local mode.',
  localBtn: 'Run Locally',
  remoteTitle: 'Connect to remote Bot Hub',
  remoteDesc: 'Paste the tailcat:// link from Remote Access. No Tailscale install needed.',
  remoteBtn: 'Connect',
  starting: 'Starting…',
  startFailed: 'Start failed',
} : null;
if (isEn) {
  document.documentElement.lang = 'en';
  document.querySelectorAll('[data-i18n]').forEach(el => { if (dict[el.dataset.i18n]) el.textContent = dict[el.dataset.i18n]; });
}
let polling = false;
async function refresh() {
  const s = await (await fetch('/api/desktop')).json();
  $('dir').textContent = s.dataDir;
  $('ocWarn').hidden = s.opencode;
  if (!$('link').value) $('link').value = s.link || '';
  $('status').textContent = s.status;
  $('status').className = s.status.startsWith('启动失败') || s.status.startsWith('Start failed') ? 'warn' : '';
  const busy = s.status === '正在启动…' || s.status === 'Starting…';
  $('local').disabled = $('remote').disabled = busy;
  return busy;
}
async function start(body) {
  await fetch('/api/desktop/start', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  $('status').textContent = isEn ? dict.starting : '正在启动…';
  if (polling) return;
  polling = true;
  // The app navigates away on success; until then, show progress or the error.
  while (true) { await new Promise(r => setTimeout(r, 700)); if (!(await refresh())) break; }
  polling = false;
}
$('local').onclick = () => start({ mode: 'local' });
$('remote').onclick = () => start({ mode: 'remote', link: $('link').value.trim() });
(() => {
  let dragArmed = false;
  $('dragBar').addEventListener('mousedown', e => {
    dragArmed = e.button === 0 && e.detail === 1;
  });
  document.addEventListener('mousemove', e => {
    if (!dragArmed || !(e.buttons & 1)) { dragArmed = false; return; }
    dragArmed = false;
    window.webkit?.messageHandlers?.external?.postMessage('wails:drag');
  });
  document.addEventListener('mouseup', () => { dragArmed = false; });
  window.addEventListener('blur', () => { dragArmed = false; });
  $('dragBar').addEventListener('dblclick', e => {
    if (window.webkit?.messageHandlers?.external) {
      e.preventDefault();
      window.webkit.messageHandlers.external.postMessage('wails:drag:doubleclick');
    }
  });
})();
refresh();
</script>
</body>
</html>
